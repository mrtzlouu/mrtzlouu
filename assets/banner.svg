<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="260" viewBox="0 0 1200 260" role="img" aria-label="Lourdes Escobar, Software and Data Developer">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0A1F44"/>
      <stop offset="1" stop-color="#1F4E79"/>
    </linearGradient>
    <pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.4" fill="#ffffff" fill-opacity="0.12"/>
    </pattern>
    <linearGradient id="fade" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#0A1F44" stop-opacity="0"/>
      <stop offset="1" stop-color="#0A1F44" stop-opacity="0.85"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="260" fill="url(#bg)"/>
  <rect width="1200" height="260" fill="url(#dots)"/>
  <rect x="640" width="560" height="260" fill="url(#fade)"/>
  <!-- code motif -->
  <g font-family="Consolas, 'Courier New', monospace" font-size="17" fill="#9CC4F0" fill-opacity="0.55">
    <text x="860" y="78">const dev = {</text>
    <text x="884" y="104">name: "Lourdes",</text>
    <text x="884" y="130">stack: ["Astro", "React"],</text>
    <text x="884" y="156">learning: true,</text>
    <text x="860" y="182">};</text>
  </g>
  <rect x="64" y="64" width="4" height="132" rx="2" fill="#7FB4FF"/>
  <text x="92" y="122" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="60" font-weight="700" letter-spacing="3" fill="#FFFFFF">LOURDES ESCOBAR</text>
  <text x="94" y="162" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="22" font-weight="500" letter-spacing="6" fill="#9CC4F0">SOFTWARE &amp; DATA DEVELOPER</text>
  <text x="94" y="198" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" letter-spacing="1.5" fill="#FFFFFF" fill-opacity="0.7">Santa Ana, El Salvador  ·  Co-founder &amp; Researcher @ WUJU</text>
</svg>
